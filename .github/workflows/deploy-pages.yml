name: Deploy Prism Console to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - app/api/static/**
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Assemble latest static workbench
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/static
          cp app/api/static/index.html _site/index.html
          cp app/api/static/*.js _site/static/
          cp app/api/static/*.css _site/static/
          cp app/api/static/*.svg _site/static/
          cp app/api/static/*.png _site/static/
          cp app/api/static/*.txt _site/static/

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
