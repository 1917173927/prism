# Install inside /etc/nginx/sites-available; included from nginx's http context.
limit_req_zone $binary_remote_addr zone=prism_auth:10m rate=5r/m;

server {
    listen 80;
    server_name 139.9.140.227;
    client_max_body_size 20m;

    location /api/v1/auth/ {
        limit_req zone=prism_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
