# Installed at /etc/nginx/conf.d/prism.conf on Alibaba Cloud Linux 3.
limit_req_zone $binary_remote_addr zone=prism_auth:10m rate=5r/m;

server {
    listen 80;
    server_name prism.endercrysta2.xyz 112.124.45.166;
    client_max_body_size 20m;

    location /.well-known/acme-challenge/ {
        root /var/www/prism-acme;
    }

    location /api/v1/auth/ {
        limit_req zone=prism_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
