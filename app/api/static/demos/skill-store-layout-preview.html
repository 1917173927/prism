<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; form-action 'none';">
  <title>AI 对话与技能商店 · 布局预览</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232b2c30'/%3E%3Ctext x='9' y='24' font-size='23' font-family='Arial' fill='white'%3EP%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      --ink: #292b31;
      --secondary: #656a73;
      --muted: #828791;
      --line: #e8e9ec;
      --sidebar: #f7f7f8;
      --hover: #eeeff1;
      --accent: #b95722;
      --accent-light: #fcf1e9;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; color: var(--ink); background: #fff; font: 14px/1.6 var(--sans); }
    body.overlay-open { overflow: hidden; }
    button, input, textarea, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    button, summary { -webkit-tap-highlight-color: transparent; }
    button:disabled { cursor: default; opacity: .5; }
    :is(button, input, textarea, select, summary, [tabindex]):focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
    h1, h2, h3, p, dl { margin: 0; }
    button { border: 0; background: transparent; }
    input, textarea, select { min-width: 0; }
    input::placeholder, textarea::placeholder { color: #8b9098; }
    .icon { width: 19px; height: 19px; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 1.65; stroke-linecap: round; stroke-linejoin: round; }
    .svg-definitions { position: absolute; width: 0; height: 0; overflow: hidden; }
    .topbar { position: sticky; top: 0; z-index: 20; min-height: 66px; display: flex; align-items: center; gap: 25px; padding: 0 26px; border-bottom: 1px solid var(--line); background: #fff; }
    .brand { display: flex; align-items: center; gap: 10px; flex: 0 0 209px; }
    .brand-mark { display: grid; place-items: center; width: 29px; height: 29px; border-radius: 9px; color: white; background: #2c2d31; font: 650 20px/1 var(--sans); }
    .brand strong { font-size: 16px; font-weight: 600; }
    .global-nav { display: flex; align-items: center; gap: 3px; min-width: 0; }
    .global-nav > span, .global-nav > button, .global-nav summary { display: block; padding: 8px 12px; border-radius: 7px; white-space: nowrap; color: var(--secondary); font-size: 13px; }
    .global-nav .active { color: var(--ink); background: #f2f2f4; font-weight: 550; }
    .nav-menu { position: relative; }
    summary { cursor: pointer; list-style: none; }
    summary::-webkit-details-marker { display: none; }
    .nav-menu summary { display: flex; align-items: center; gap: 5px; }
    .nav-menu summary .icon { width: 13px; height: 13px; }
    .nav-menu-panel { position: absolute; top: calc(100% + 8px); right: 0; z-index: 15; width: 170px; padding: 7px; border: 1px solid var(--line); border-radius: 12px; background: white; box-shadow: 0 12px 32px #24272d12; }
    .nav-menu-panel span { display: block; padding: 9px 10px; color: var(--secondary); font-size: 13px; }
    .preview-badge { margin-left: auto; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; color: var(--muted); font-size: 11px; white-space: nowrap; }
    .shell { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: calc(100dvh - 66px); }
    .sidebar { position: sticky; top: 66px; height: calc(100dvh - 66px); display: flex; flex-direction: column; gap: 22px; padding: 20px 13px 13px; background: var(--sidebar); }
    .sidebar-actions { display: grid; gap: 5px; }
    .sidebar-action { display: flex; align-items: center; gap: 11px; width: 100%; min-height: 43px; padding: 10px 12px; border-radius: 9px; text-align: left; font-size: 14px; }
    .sidebar-action:hover { background: var(--hover); }
    .sidebar-action.is-active { color: var(--accent); background: var(--accent-light); font-weight: 550; }
    .sidebar-action .icon { width: 18px; height: 18px; }
    .sidebar-search { display: flex; align-items: center; gap: 11px; min-height: 43px; padding: 8px 12px; color: var(--secondary); border: 1px solid transparent; border-radius: 9px; }
    .sidebar-search:focus-within { background: white; border-color: #dedfe3; }
    .sidebar-search input { width: 100%; padding: 0; border: 0; outline: none; background: transparent; font-size: 14px; }
    .history { flex: 1; min-height: 90px; padding: 0 12px; }
    .history h2 { margin-bottom: 15px; color: var(--muted); font-size: 12px; font-weight: 500; }
    .history p { color: var(--muted); font-size: 13px; }
    .account-button { display: flex; align-items: center; gap: 11px; width: 100%; padding: 10px; border-radius: 10px; text-align: left; }
    .account-button:hover { background: var(--hover); }
    .account-avatar { display: grid; place-items: center; width: 32px; height: 32px; border: 1px solid #dedfe3; border-radius: 50%; background: #fff; color: var(--secondary); }
    .account-button > .icon { margin-left: auto; width: 16px; height: 16px; color: var(--muted); }
    .sidebar-close, .mobile-sidebar-trigger, .sidebar-backdrop { display: none; }
    main { min-width: 0; }
    .chat-page { display: flex; flex-direction: column; min-height: calc(100dvh - 66px); padding: 20px 36px 17px; }
    .conversation-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 40px; }
    .model-trigger { display: inline-flex; align-items: center; gap: 8px; min-width: 0; padding: 6px 0; font-size: 15px; font-weight: 550; }
    .model-trigger span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .model-trigger .icon { width: 14px; height: 14px; color: var(--muted); }
    .quiet-button { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 36px; padding: 7px 10px; border-radius: 8px; color: var(--secondary); font-size: 13px; }
    .quiet-button:hover { background: #f5f5f6; color: var(--ink); }
    .chat-center { flex: 1; display: flex; flex-direction: column; justify-content: center; width: min(100%, 740px); margin: auto; padding: 35px 0 90px; }
    .chat-center h1 { margin: 0 0 32px; text-align: center; font-size: clamp(27px, 3vw, 34px); line-height: 1.35; font-weight: 550; letter-spacing: -.025em; }
    .composer { position: relative; border: 1px solid #d8dbe0; border-radius: 22px; background: #fff; box-shadow: 0 5px 22px #292c3307; }
    .composer:focus-within { border-color: #bb7b56; box-shadow: 0 0 0 3px #b957220a; }
    .composer textarea { display: block; width: 100%; min-height: 96px; padding: 20px 19px 8px; border: 0; outline: none; border-radius: 22px 22px 0 0; background: transparent; resize: vertical; font-size: 16px; line-height: 1.65; }
    .composer-bottom { display: flex; align-items: center; gap: 7px; padding: 5px 11px 11px; }
    .composer-bottom .quiet-button { min-height: 35px; }
    .composer-bottom .icon-button { width: 35px; height: 35px; }
    .composer-bottom .tool-trigger { font-size: 13px; }
    .composer-bottom .tool-trigger .icon { width: 14px; height: 14px; }
    .composer-spacer { flex: 1; }
    .send-button { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: #35363a; color: white; }
    .send-button:disabled { opacity: 1; background: #e7e8eb; color: #a1a5ae; }
    .selection-row { display: flex; flex-wrap: wrap; gap: 7px; padding: 13px 14px 0; }
    .selection-row:not(:has(> :not([hidden]))) { display: none; }
    .selection-chip { display: inline-flex; align-items: center; gap: 8px; max-width: 100%; padding: 4px 8px; border: 1px solid var(--line); border-radius: 7px; color: var(--secondary); background: #f8f8f9; font-size: 12px; }
    .selection-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .selection-chip button { padding: 0 3px; color: var(--secondary); }
    .tools-menu { position: absolute; z-index: 10; bottom: 59px; left: 45px; width: 235px; padding: 6px; border: 1px solid var(--line); border-radius: 13px; background: #fff; box-shadow: 0 12px 32px #24272d16; }
    .tools-menu button { display: flex; align-items: center; gap: 11px; width: 100%; min-height: 40px; padding: 9px 11px; border-radius: 7px; text-align: left; }
    .tools-menu button:hover { background: #f4f4f5; }
    .tools-menu .icon { color: var(--secondary); width: 17px; height: 17px; }
    .quick-prompts { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin-top: 22px; }
    .quick-prompts button { padding: 7px 12px; border: 1px solid var(--line); border-radius: 8px; color: var(--secondary); font-size: 12px; }
    .quick-prompts button:hover { background: #fafafa; border-color: #d7dae0; }
    .preview-footer { text-align: center; color: var(--muted); font-size: 11px; }
    .store-page { width: min(100%, 1152px); min-height: calc(100dvh - 66px); margin: auto; padding: 49px 50px 24px; }
    .store-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 28px; }
    .store-heading h1 { font-size: 31px; font-weight: 600; line-height: 1.35; letter-spacing: -.025em; }
    .store-heading p { margin-top: 10px; color: var(--secondary); font-size: 14px; }
    .store-heading .quiet-button { margin-top: 1px; }
    .store-search { display: flex; align-items: center; gap: 11px; min-height: 49px; padding: 11px 15px; border: 1px solid #dce0e5; border-radius: 11px; background: #fafafb; color: var(--muted); }
    .store-search:focus-within { background: white; border-color: #bb7b56; }
    .store-search input { width: 100%; border: 0; outline: none; background: transparent; font-size: 14px; }
    .store-navigation { display: flex; align-items: center; justify-content: space-between; gap: 15px; margin: 27px 0 21px; border-bottom: 1px solid var(--line); }
    .directory-tabs { display: flex; align-items: center; gap: 27px; }
    .directory-tabs button { position: relative; min-height: 44px; padding: 8px 1px 13px; color: var(--secondary); font-size: 14px; }
    .directory-tabs button[aria-selected="true"] { color: var(--ink); font-weight: 550; }
    .directory-tabs button[aria-selected="true"]::after { content: ""; position: absolute; bottom: -1px; left: 0; right: 0; height: 2px; border-radius: 2px; background: var(--ink); }
    .store-filter { position: relative; padding-bottom: 7px; }
    .store-filter > summary { display: flex; align-items: center; gap: 7px; padding: 5px 3px; color: var(--secondary); font-size: 12px; }
    .store-filter .icon { width: 16px; height: 16px; }
    .filter-panel { position: absolute; top: calc(100% + 8px); right: 0; z-index: 10; width: 210px; padding: 15px; border: 1px solid var(--line); border-radius: 11px; background: white; box-shadow: 0 12px 32px #24272d12; }
    .filter-panel label { display: flex; align-items: center; gap: 9px; font-size: 13px; }
    .filter-panel .quiet-button { margin-top: 13px; padding-left: 0; }
    .categories { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 29px; }
    .categories button { min-height: 33px; padding: 5px 12px; border-radius: 7px; color: var(--secondary); font-size: 12px; }
    .categories button:hover { background: #f6f6f8; }
    .categories button[aria-pressed="true"] { color: var(--ink); background: #f0f1f3; font-weight: 550; }
    .catalog-heading { display: flex; justify-content: space-between; align-items: center; gap: 15px; margin-bottom: 17px; }
    .catalog-heading h2 { font-size: 16px; font-weight: 550; }
    .catalog-heading span { color: var(--muted); font-size: 12px; }
    .skill-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
    .skill-card { min-width: 0; display: flex; flex-direction: column; min-height: 190px; padding: 22px; border: 1px solid var(--line); border-radius: 14px; background: white; transition: border-color 120ms ease, box-shadow 120ms ease; }
    .skill-card:hover { border-color: #cfd3d9; box-shadow: 0 4px 15px #292c3306; }
    .skill-card-heading { display: flex; align-items: center; gap: 12px; margin-bottom: 15px; }
    .skill-glyph { display: grid; place-items: center; flex: 0 0 auto; width: 40px; height: 40px; border: 1px solid #e6e8eb; border-radius: 11px; color: #737981; background: #f8f9fa; }
    .skill-glyph[data-tone="orange"] { color: #b4602f; background: #fcf4ee; border-color: #f1e4da; }
    .skill-glyph[data-tone="blue"] { color: #587791; background: #f0f5fa; border-color: #e1e9f2; }
    .skill-glyph[data-tone="green"] { color: #628374; background: #f1f7f4; border-color: #e1ece6; }
    .skill-card-title { min-width: 0; }
    .skill-card-title button { display: block; padding: 0; text-align: left; font-size: 14px; font-weight: 600; line-height: 1.45; }
    .skill-card-title button:hover { color: var(--accent); }
    .skill-card-title small { display: block; margin-top: 3px; color: var(--muted); font-size: 11px; }
    .skill-card p { color: var(--secondary); font-size: 12px; line-height: 1.75; }
    .skill-card-footer { display: flex; align-items: center; justify-content: space-between; gap: 9px; margin-top: auto; padding-top: 20px; }
    .skill-card-footer > span { color: var(--muted); font-size: 11px; }
    .skill-card-footer button { display: flex; align-items: center; gap: 5px; padding: 0; color: var(--secondary); font-size: 12px; }
    .skill-card-footer button .icon { width: 13px; height: 13px; }
    .skill-card-footer .selected { color: var(--accent); }
    .catalog-empty { padding: 64px 20px; border: 1px dashed var(--line); border-radius: 14px; color: var(--secondary); text-align: center; }
    .store-page .preview-footer { margin-top: 30px; }
    dialog { width: min(540px, calc(100% - 36px)); max-height: calc(100dvh - 40px); padding: 0; border: 1px solid var(--line); border-radius: 17px; overflow: auto; color: var(--ink); background: white; box-shadow: 0 24px 90px #23262d26; }
    dialog::backdrop { background: #20232b40; }
    .dialog-header { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 21px 26px 18px; border-bottom: 1px solid var(--line); }
    .dialog-header h2 { font-size: 19px; font-weight: 550; }
    .icon-button { display: grid; place-items: center; flex: 0 0 auto; width: 36px; height: 36px; padding: 0; border-radius: 8px; color: var(--secondary); }
    .icon-button:hover { background: #f3f3f5; }
    .icon-button .icon { width: 17px; height: 17px; }
    .dialog-body { padding: 25px 26px; }
    .detail-identity { display: flex; align-items: center; gap: 14px; margin-bottom: 19px; }
    .detail-identity .skill-glyph { width: 54px; height: 54px; border-radius: 14px; }
    .detail-identity .skill-glyph .icon { width: 25px; height: 25px; }
    .detail-identity strong { display: block; font-size: 18px; font-weight: 550; }
    .detail-identity small { display: block; margin-top: 3px; color: var(--muted); font-size: 12px; }
    .detail-description { color: var(--secondary); font-size: 14px; line-height: 1.8; }
    .disclosure { margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--line); }
    .disclosure > summary { display: flex; align-items: center; justify-content: space-between; gap: 14px; color: var(--secondary); font-size: 13px; }
    .disclosure summary .icon { width: 14px; height: 14px; }
    .disclosure[open] summary .icon { transform: rotate(180deg); }
    .metadata { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 11px 15px; margin-top: 20px; font-size: 12px; }
    .metadata dt { color: var(--muted); }
    .metadata dd { margin: 0; overflow-wrap: anywhere; }
    .metadata code { font: 11px/1.65 ui-monospace, Consolas, monospace; }
    .dialog-footer { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 17px 26px; border-top: 1px solid var(--line); }
    .dialog-footer small { color: var(--muted); font-size: 11px; }
    .primary-button { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 39px; padding: 8px 17px; border-radius: 8px; color: white; background: #33353a; font-weight: 500; font-size: 13px; }
    .primary-button:hover { background: #484a50; }
    .form-field { display: grid; gap: 7px; margin-bottom: 18px; font-size: 13px; }
    .form-field input, .form-field select { width: 100%; min-height: 42px; padding: 9px 12px; border: 1px solid #dce0e5; border-radius: 8px; background: white; }
    .form-field input:disabled { background: #f8f8f9; }
    .modal-note { margin: 5px 0 21px; color: var(--muted); font-size: 12px; }
    .dialog-body .disclosure .form-field:first-of-type { margin-top: 19px; }
    .context-list { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 19px; font-size: 13px; }
    .context-list dt { color: var(--secondary); }
    .context-list dd { margin: 0; color: var(--muted); }
    .detail-levels { display: flex; gap: 5px; padding: 4px; border-radius: 9px; background: #f3f3f5; }
    .detail-levels button { flex: 1; min-height: 38px; padding: 7px 9px; border-radius: 7px; color: var(--secondary); font-size: 13px; }
    .detail-levels button[aria-pressed="true"] { background: white; color: var(--ink); box-shadow: 0 1px 4px #23262d09; }
    @media (max-width: 1220px) {
      .topbar { gap: 18px; padding-inline: 20px; }
      .brand { flex-basis: 196px; }
      .global-nav > span, .global-nav > button, .global-nav summary { padding-inline: 8px; font-size: 12px; }
      .shell { grid-template-columns: 228px minmax(0, 1fr); }
      .store-page { padding-inline: 30px; }
      .skill-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 980px) {
      .topbar { flex-wrap: wrap; column-gap: 14px; row-gap: 0; padding: 0 17px; }
      .brand { flex-basis: auto; min-height: 57px; }
      .global-nav { order: 3; flex-basis: 100%; min-height: 45px; overflow-x: auto; scrollbar-width: none; }
      .shell { min-height: calc(100dvh - 102px); }
      .sidebar { top: 102px; height: calc(100dvh - 102px); }
      .nav-menu-panel { position: fixed; top: 108px; right: 17px; }
      .chat-page, .store-page { min-height: calc(100dvh - 102px); }
      .chat-page { padding-inline: 24px; }
      .store-page { padding-top: 34px; }
      .store-heading h1 { font-size: 28px; }
      .skill-card { padding: 18px; }
      .quick-prompts { flex-direction: column; align-items: center; gap: 5px; }
      .quick-prompts button { border-color: transparent; }
    }
    @media (max-width: 720px) {
      .topbar { padding-inline: 14px; }
      .brand strong { font-size: 15px; }
      .mobile-sidebar-trigger { display: grid; width: 29px; height: 34px; margin-right: 2px; }
      .brand { gap: 8px; }
      .shell { display: block; }
      .sidebar { position: fixed; top: 0; left: 0; z-index: 30; width: min(280px, calc(100vw - 42px)); height: 100dvh; padding-top: 60px; visibility: hidden; transform: translateX(-100%); transition: transform 160ms ease, visibility 160ms ease; }
      .sidebar.is-open { visibility: visible; transform: translateX(0); }
      .sidebar-close { position: absolute; display: grid; top: 14px; right: 15px; }
      .sidebar-backdrop { position: fixed; inset: 0; z-index: 29; display: block; width: 100%; height: 100%; background: #20232b40; }
      .chat-page { padding: 15px 18px 17px; }
      .conversation-header { gap: 9px; }
      .model-trigger { font-size: 13px; }
      .conversation-header > .quiet-button { padding-inline: 4px; font-size: 12px; white-space: nowrap; }
      .conversation-header > .quiet-button .icon { display: none; }
      .chat-center { padding: 28px 0 55px; }
      .chat-center h1 { margin-bottom: 25px; }
      .composer textarea { font-size: 15px; }
      .store-page { padding: 28px 20px 22px; }
      .store-heading { gap: 12px; margin-bottom: 25px; }
      .store-heading h1 { font-size: 27px; }
      .store-heading p { font-size: 12px; }
      .store-heading .quiet-button { padding-inline: 0; white-space: nowrap; font-size: 12px; }
      .store-navigation { margin-top: 21px; }
      .directory-tabs { gap: 21px; }
      .directory-tabs button { font-size: 13px; }
      .categories { gap: 5px; margin-bottom: 24px; }
      .categories button { padding-inline: 10px; }
      .skill-grid { grid-template-columns: minmax(0, 1fr); gap: 13px; }
      .skill-card { min-height: 174px; padding: 20px; }
      .dialog-header, .dialog-body, .dialog-footer { padding-inline: 22px; }
      .dialog-header h2 { font-size: 18px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>

    <div class="dialog-body"><label class="form-field">回答详细度</label><div class="detail-levels" role="group" aria-label="回答详细度"><button type="button" aria-pressed="false">简洁</button><button type="button" aria-pressed="true">标准</button><button type="button" aria-pressed="false">详细</button></div></div>

  <script>
    const byId = id => document.getElementById(id);
    const categoryLabels = {ALL: "全部", MARKET_DATA: "行情", COMPANY_DATA: "财务", INDUSTRY_DATA: "行业", FUND_DATA: "基金", CONVERTIBLE_BOND_DATA: "可转债", MACRO_DATA: "宏观", SEARCH_NEWS: "公告与新闻", SEARCH_REPORTS: "研报"};
    // 名称、identifier、版本和 endpoint 使用项目登记内容。
    const skills = [
      {skill_id: "hithink-market-query", name: "行情数据查询", operation: "MARKET_DATA", version: "1.0.0", endpoint: "/v1/query2data", icon: "chart", tone: "orange", description: "查询证券行情，为标的研究提供价格信息。"},
      {skill_id: "hithink-finance-query", name: "财务数据查询", operation: "COMPANY_DATA", version: "1.0.0", endpoint: "/v1/query2data", icon: "file", tone: "blue", description: "查询上市公司财务数据，了解公司经营情况。"},
      {skill_id: "hithink-industry-query", name: "行业数据查询", operation: "INDUSTRY_DATA", version: "1.0.0", endpoint: "/v1/query2data", icon: "layers", tone: "green", description: "查询行业数据，用于行业观察与配置研究。"},
      {skill_id: "hithink-fund-query", name: "基金理财查询", operation: "FUND_DATA", version: "1.0.0", endpoint: "/v1/query2data", icon: "pie", tone: "green", description: "查询基金与理财产品信息，用于基金研究。"},
      {skill_id: "hithink-cb-selector", name: "问财选可转债", operation: "CONVERTIBLE_BOND_DATA", version: "1.0.0", endpoint: "/v1/query2data", icon: "bond", tone: "orange", description: "查询可转债信息，支持可转债筛选与研究。"},
      {skill_id: "hithink-macro-query", name: "宏观数据查询", operation: "MACRO_DATA", version: "1.0.0", endpoint: "/v1/query2data", icon: "globe", tone: "blue", description: "查询宏观数据，了解市场研究所需的经济背景。"},
      {skill_id: "announcement-search", name: "公告搜索", operation: "SEARCH_NEWS", version: "1.0.0", endpoint: "/v1/comprehensive/search", icon: "file", tone: "blue", description: "检索上市公司公告，查看相关披露信息。"},
      {skill_id: "news-search", name: "新闻搜索", operation: "SEARCH_NEWS", version: "1.0.0", endpoint: "/v1/comprehensive/search", icon: "news", tone: "orange", description: "检索财经新闻，补充市场与标的研究资料。"},
      {skill_id: "report-search", name: "研报搜索", operation: "SEARCH_REPORTS", version: "1.0.0", endpoint: "/v1/comprehensive/search", icon: "file", tone: "green", description: "检索研究报告，查找相关研究观点与资料。"}
    ];
    const selectedSkills = new Set();
    const mobileViewport = window.matchMedia("(max-width: 720px)");
    let currentDirectory = "ALL";
    let currentCategory = "ALL";
    let detailSkill = null;

    function icon(name) {
      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.classList.add("icon");
      svg.setAttribute("aria-hidden", "true");
      const use = document.createElementNS("http://www.w3.org/2000/svg", "use");
      use.setAttribute("href", `#icon-${name}`);
      svg.append(use);
      return svg;
    }
    function node(tag, text, className) {
      const result = document.createElement(tag);
      if (text != null) result.textContent = text;
      if (className) result.className = className;
      return result;
    }
    function syncOverlayState() {
      document.body.classList.toggle("overlay-open", Boolean(document.querySelector("dialog[open]")) || (mobileViewport.matches && byId("sidebar").classList.contains("is-open")));
    }
    function setSidebarOpen(open) {
      byId("sidebar").classList.toggle("is-open", open);
      byId("sidebar").inert = mobileViewport.matches && !open;
      byId("sidebar-backdrop").hidden = !open || !mobileViewport.matches;
      byId("sidebar-trigger").setAttribute("aria-expanded", String(open));
      syncOverlayState();
      if (open && mobileViewport.matches) byId("sidebar-close").focus();
    }
    function showDialog(id) {
      setToolsOpen(false);
      setSidebarOpen(false);
      byId(id).showModal();
      syncOverlayState();
    }
    function setRoute(route) {
      byId("chat-page").hidden = route !== "chat";
      byId("store-page").hidden = route !== "store";
      byId("nav-store").classList.toggle("is-active", route === "store");
      byId("nav-chat").classList.toggle("active", route === "chat");
      byId("nav-store").removeAttribute("aria-current");
      byId("nav-chat").removeAttribute("aria-current");
      byId(route === "store" ? "nav-store" : "nav-chat").setAttribute("aria-current", "page");
      byId("research-navigation").open = false;
      setToolsOpen(false);
      setSidebarOpen(false);
      byId(route === "store" ? "store-title" : "chat-title").focus({preventScroll: true});
      window.scrollTo({top: 0, behavior: "instant"});
    }
    function setToolsOpen(open) {
      byId("tools-menu").hidden = !open;
      byId("tools-trigger").setAttribute("aria-expanded", String(open));
    }
    function renderSkills() {
      const search = byId("skill-search").value.trim().toLocaleLowerCase("zh-CN");
      const visible = skills.filter(skill => (currentDirectory === "ALL" || selectedSkills.has(skill.skill_id)) && (currentCategory === "ALL" || skill.operation === currentCategory) && [skill.name, skill.description, categoryLabels[skill.operation]].some(value => value.toLocaleLowerCase("zh-CN").includes(search)));
      byId("skill-catalog").replaceChildren();
      byId("catalog-count").textContent = `${visible.length} 项技能`;
      byId("catalog-heading").textContent = currentCategory !== "ALL" ? categoryLabels[currentCategory] : currentDirectory === "ALL" ? "全部技能" : "我已选择";
      byId("catalog-empty").hidden = visible.length > 0;
      byId("catalog-empty").textContent = currentDirectory === "PERSONAL" && selectedSkills.size === 0 ? "尚未选择技能。" : "没有符合当前筛选条件的技能。";
      for (const skill of visible) {
        const card = node("article", null, "skill-card");
        card.dataset.skillId = skill.skill_id;
        const heading = node("div", null, "skill-card-heading");
        const glyph = node("span", null, "skill-glyph"); glyph.dataset.tone = skill.tone; glyph.append(icon(skill.icon));
        const title = node("div", null, "skill-card-title");
        const name = node("button", skill.name); name.type = "button"; name.dataset.openSkill = skill.skill_id; name.setAttribute("aria-haspopup", "dialog"); name.setAttribute("aria-controls", "skill-dialog"); name.addEventListener("click", () => openSkill(skill));
        title.append(name, node("small", categoryLabels[skill.operation])); heading.append(glyph, title);
        const footer = node("div", null, "skill-card-footer");
        const state = node("span", selectedSkills.has(skill.skill_id) ? "已选择" : byId("show-versions").checked ? `版本 ${skill.version}` : "");
        if (selectedSkills.has(skill.skill_id)) state.classList.add("selected");
        const detail = node("button", "查看详情"); detail.type = "button"; detail.setAttribute("aria-label", `查看${skill.name}详情`); detail.setAttribute("aria-haspopup", "dialog"); detail.addEventListener("click", () => openSkill(skill)); detail.append(icon("right"));
        footer.append(state, detail); card.append(heading, node("p", skill.description), footer); byId("skill-catalog").append(card);
      }
    }
    function openSkill(skill) {
      detailSkill = skill;
      byId("detail-name").textContent = skill.name;
      byId("detail-category").textContent = categoryLabels[skill.operation];
      byId("detail-description").textContent = skill.description;
      byId("detail-glyph").dataset.tone = skill.tone;
      byId("detail-glyph").replaceChildren(icon(skill.icon));
      byId("detail-metadata").replaceChildren();
      for (const [label, value] of Object.entries({"版本": skill.version, "skill_id": skill.skill_id, "operation": skill.operation, "endpoint": skill.endpoint})) {
        const description = node("dd"); description.append(node("code", value)); byId("detail-metadata").append(node("dt", label), description);
      }
      byId("skill-technical-details").open = false;
      byId("select-skill").textContent = selectedSkills.has(skill.skill_id) ? "取消选择" : "选择此技能";
      showDialog("skill-dialog");
    }
    function selectDirectory(directory, focus = false) {
      currentDirectory = directory;
      for (const [id, value] of [["directory-all", "ALL"], ["directory-personal", "PERSONAL"]]) {
        byId(id).setAttribute("aria-selected", String(value === directory)); byId(id).tabIndex = value === directory ? 0 : -1;
        if (value === directory) { byId("catalog-panel").setAttribute("aria-labelledby", id); if (focus) byId(id).focus(); }
      }
      renderSkills();
    }

    for (const [key, label] of Object.entries(categoryLabels)) {
      const button = node("button", label); button.type = "button"; button.dataset.category = key; button.setAttribute("aria-pressed", String(key === "ALL"));
      button.addEventListener("click", () => { currentCategory = key; byId("skill-categories").querySelectorAll("button").forEach(item => item.setAttribute("aria-pressed", String(item === button))); renderSkills(); });
      byId("skill-categories").append(button);
    }
    document.querySelectorAll("[data-route]").forEach(button => button.addEventListener("click", () => setRoute(button.dataset.route)));
    document.querySelectorAll("[data-close]").forEach(button => button.addEventListener("click", () => byId(button.dataset.close).close()));
    document.querySelectorAll("dialog").forEach(dialog => {
      dialog.addEventListener("close", syncOverlayState);
      dialog.addEventListener("click", event => {
        if (event.target !== dialog) return;
        const rect = dialog.getBoundingClientRect();
        if (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom) dialog.close();
      });
    });
    byId("skill-dialog").addEventListener("close", () => {
      const opener = document.querySelector(`[data-open-skill="${detailSkill.skill_id}"]`);
      (opener || byId("store-title")).focus({preventScroll: true});
    });
    byId("select-skill").addEventListener("click", () => {
      if (selectedSkills.has(detailSkill.skill_id)) selectedSkills.delete(detailSkill.skill_id); else selectedSkills.add(detailSkill.skill_id);
      byId("select-skill").textContent = selectedSkills.has(detailSkill.skill_id) ? "取消选择" : "选择此技能";
      renderSkills();
    });
    byId("directory-all").addEventListener("click", () => selectDirectory("ALL"));
    byId("directory-personal").addEventListener("click", () => selectDirectory("PERSONAL"));
    document.querySelector(".directory-tabs").addEventListener("keydown", event => {
      if (!["ArrowLeft", "ArrowRight", "Home", "End"].includes(event.key)) return;
      event.preventDefault(); selectDirectory(event.key === "Home" ? "ALL" : event.key === "End" ? "PERSONAL" : currentDirectory === "ALL" ? "PERSONAL" : "ALL", true);
    });
    byId("skill-search").addEventListener("input", renderSkills);
    byId("show-versions").addEventListener("change", renderSkills);
    byId("reset-filters").addEventListener("click", () => {
      byId("skill-search").value = ""; byId("show-versions").checked = false; currentCategory = "ALL";
      byId("skill-categories").querySelectorAll("button").forEach(button => button.setAttribute("aria-pressed", String(button.dataset.category === "ALL")));
      selectDirectory("ALL"); byId("store-filter").open = false;
    });
    byId("chat-search").addEventListener("input", () => { byId("history-empty").textContent = byId("chat-search").value.trim() ? "没有匹配的对话" : "暂无历史对话"; });
    // 搜索内容不保存，初次进入和页面恢复时保持空白。
    function clearConversationSearch() { byId("chat-search").value = ""; byId("history-empty").textContent = "暂无历史对话"; }
    clearConversationSearch();
    window.addEventListener("pageshow", clearConversationSearch);
    byId("new-conversation").addEventListener("click", () => {
      clearConversationSearch(); byId("chat-input").value = ""; byId("tool-chip").hidden = true; byId("file-chip").hidden = true; byId("upload-input").value = ""; setRoute("chat"); byId("chat-input").focus();
    });
    byId("tools-trigger").addEventListener("click", () => { const open = byId("tools-menu").hidden; setToolsOpen(open); if (open) byId("tools-menu").querySelector("button").focus(); });
    byId("tools-menu").querySelectorAll("button").forEach(button => button.addEventListener("click", () => { byId("tool-chip-label").textContent = button.dataset.tool; byId("tool-chip").hidden = false; setToolsOpen(false); byId("chat-input").focus(); }));
    byId("clear-tool").addEventListener("click", () => { byId("tool-chip").hidden = true; byId("tools-trigger").focus(); });
    document.querySelectorAll(".quick-prompts button").forEach(button => button.addEventListener("click", () => { byId("chat-input").value = button.textContent; byId("chat-input").focus(); }));
    byId("upload-trigger").addEventListener("click", () => byId("upload-input").click());
    byId("upload-input").addEventListener("change", () => { const file = byId("upload-input").files[0]; byId("file-chip").hidden = !file; byId("file-chip-label").textContent = file?.name || ""; });
    byId("clear-file").addEventListener("click", () => { byId("upload-input").value = ""; byId("file-chip").hidden = true; byId("upload-trigger").focus(); });
    byId("model-trigger").addEventListener("click", () => { byId("model-name").value = byId("model-label").textContent; byId("model-advanced").open = false; showDialog("model-dialog"); });
    byId("model-form").addEventListener("submit", event => { event.preventDefault(); const model = byId("model-name").value.trim(); if (!model) { byId("model-name").focus(); return; } byId("model-label").textContent = model; byId("model-dialog").close(); });
    byId("context-trigger").addEventListener("click", () => showDialog("context-dialog"));
    byId("account-trigger").addEventListener("click", () => showDialog("account-dialog"));
    document.querySelectorAll(".detail-levels button").forEach(button => button.addEventListener("click", () => document.querySelectorAll(".detail-levels button").forEach(item => item.setAttribute("aria-pressed", String(item === button)))));
    byId("sidebar-trigger").addEventListener("click", () => setSidebarOpen(true));
    byId("sidebar-close").addEventListener("click", () => { setSidebarOpen(false); byId("sidebar-trigger").focus(); });
    byId("sidebar-backdrop").addEventListener("click", () => { setSidebarOpen(false); byId("sidebar-trigger").focus(); });
    mobileViewport.addEventListener("change", () => setSidebarOpen(false));
    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && !byId("tools-menu").hidden) { setToolsOpen(false); byId("tools-trigger").focus(); }
      if (event.key === "Escape" && byId("sidebar").classList.contains("is-open")) { setSidebarOpen(false); byId("sidebar-trigger").focus(); }
      if (event.key === "Tab" && mobileViewport.matches && byId("sidebar").classList.contains("is-open") && !document.querySelector("dialog[open]")) {
        const controls = [...byId("sidebar").querySelectorAll("button, input")].filter(element => !element.disabled && element.getClientRects().length);
        const first = controls[0], last = controls[controls.length - 1];
        if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
        else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
      }
    });
    document.addEventListener("click", event => {
      if (!byId("tools-menu").contains(event.target) && !byId("tools-trigger").contains(event.target)) setToolsOpen(false);
      for (const id of ["store-filter", "research-navigation"]) if (!byId(id).contains(event.target)) byId(id).open = false;
    });
    setSidebarOpen(false);
    renderSkills();
  </script>
</body>
</html>
