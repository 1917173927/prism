<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>问财智投 · 本地演示登录</title>
<style>body{margin:0;font:15px system-ui,"Microsoft YaHei",sans-serif;background:#f3f6fb;color:#18243a;display:grid;min-height:100vh;place-items:center}.card{width:min(420px,calc(100% - 40px));padding:38px;background:#fff;border:1px solid #dce4f0;border-radius:16px;box-shadow:0 20px 50px #18243a18}h1{margin:0 0 8px}p{line-height:1.6;color:#52627a}label{display:grid;gap:7px;margin:16px 0}input{padding:11px;border:1px solid #b9c6d9;border-radius:8px}button{width:100%;padding:12px;border:0;border-radius:8px;background:#1769e0;color:#fff;font-weight:700}.note{font-size:12px}.error{color:#b42318;min-height:20px}</style></head>
<body><main class="card"><h1>问财智投</h1><p>使用已配置的本地演示账户登录。注册、密码找回与邮件验证未开放。</p><form id="login"><label>用户名<input id="username" required autocomplete="username"></label><label>密码<input id="password" type="password" required autocomplete="current-password"></label><p class="error" id="error"></p><button>进入投顾工作台</button></form><p class="note">本地演示环境；分析结果仅供研究参考，不构成投资建议。</p></main><script>document.querySelector('#login').addEventListener('submit',async e=>{e.preventDefault();const u=username.value,p=password.value,error=document.querySelector('#error');error.textContent='';const h={Authorization:'Basic '+btoa(unescape(encodeURIComponent(u+':'+p)))};const r=await fetch('/api/v1/auth/login',{method:'POST',headers:h});if(!r.ok){error.textContent='用户名或密码无效。';return}location.href='/';});</script></body></html>
