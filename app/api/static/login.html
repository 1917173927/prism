<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>问财智投 · 账户登录</title>
  <style>
    :root{color-scheme:light dark;--bg:#f7f7f8;--card:#fff;--text:#202124;--muted:#747980;--line:#e3e3e5;--accent:#d96600;--danger:#b42318}*{box-sizing:border-box}body{margin:0;min-height:100vh;font:15px/1.55 Inter,system-ui,"Microsoft YaHei",sans-serif;background:radial-gradient(circle at 50% 35%,#fff 0,var(--bg) 52%);color:var(--text);display:grid;place-items:center}.shell{width:min(440px,calc(100% - 32px))}.brand{display:flex;align-items:center;gap:12px;margin:0 0 24px}.mark{display:grid;place-items:center;width:42px;height:42px;border-radius:11px;background:#242629;color:#fff;font:700 22px Georgia;position:relative}.mark:after{content:"";position:absolute;width:13px;height:13px;background:var(--accent);transform:translate(14px,14px);clip-path:polygon(0 0,100% 0,100% 100%)}.brand strong{display:block;font-size:20px}.brand span{display:block;color:var(--muted);font-size:12px}.card{padding:32px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 24px 60px #24262914}h1{font-size:28px;margin:0 0 6px}p{color:var(--muted);margin:0 0 22px}.tabs{display:grid;grid-template-columns:1fr 1fr;padding:4px;background:var(--bg);border-radius:10px;margin-bottom:20px}.tabs button{background:none;color:var(--muted);border:0;padding:9px;border-radius:7px}.tabs button.active{background:var(--card);color:var(--accent);box-shadow:0 1px 4px #0001;font-weight:700}label{display:grid;gap:7px;margin:14px 0;font-weight:600}input{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--text);font:inherit}input:focus{outline:2px solid #d9660030;border-color:var(--accent)}button[type=submit]{width:100%;padding:12px;border:0;border-radius:9px;background:var(--accent);color:#fff;font-weight:700;margin-top:12px}.error{min-height:22px;color:var(--danger);margin:10px 0 0}.note{font-size:12px;margin:20px 0 0}.register-only{display:none}form.register .register-only{display:grid}@media(prefers-color-scheme:dark){:root{--bg:#171819;--card:#202123;--text:#f4f4f4;--muted:#a8abb0;--line:#383a3d}body{background:radial-gradient(circle at 50% 35%,#28292b 0,var(--bg) 55%)}}
  </style>
  <style>.mark{overflow:hidden;background:transparent}.mark:after{display:none}.mark img{display:block;width:100%;height:100%}</style>
</head>
<body><main class="shell"><div class="brand" aria-label="问财智投"><span class="mark" aria-hidden="true"><img src="/static/wencai-zhitou-logo.svg" alt=""></span><div><strong>问财智投</strong><span>个性化证券投顾</span></div></div><section class="card"><h1 id="title">登录账户</h1><p id="intro">进入你的独立数据空间，继续分析已确认的持仓与画像。</p><div class="tabs"><button id="login-tab" class="active" type="button">登录</button><button id="register-tab" type="button">注册</button></div><form id="account-form"><label>用户名<input id="username" required minlength="3" maxlength="100" autocomplete="username"></label><label>密码<input id="password" type="password" required minlength="12" maxlength="512" autocomplete="current-password"></label><label class="register-only">确认密码<input id="confirmation" type="password" minlength="12" maxlength="512" autocomplete="new-password"></label><div class="error" id="error" role="alert"></div><button type="submit" id="submit">进入问财智投</button></form><p class="note">持仓、画像与聊天记录按账户隔离；模型及数据服务配置由本机安装共享。本地分析仅供研究参考。</p></section></main>
<script>
const form=document.querySelector('#account-form'),error=document.querySelector('#error'),usernameInput=document.querySelector('#username'),passwordInput=document.querySelector('#password'),confirmationInput=document.querySelector('#confirmation');let mode='login';function setMode(next){mode=next;form.classList.toggle('register',mode==='register');document.querySelector('#login-tab').classList.toggle('active',mode==='login');document.querySelector('#register-tab').classList.toggle('active',mode==='register');document.querySelector('#title').textContent=mode==='login'?'登录账户':'创建账户';document.querySelector('#intro').textContent=mode==='login'?'进入你的独立数据空间，继续分析已确认的持仓与画像。':'新账户从空数据空间开始，不继承其他账户的数据。';document.querySelector('#submit').textContent=mode==='login'?'进入问财智投':'创建并进入';passwordInput.autocomplete=mode==='login'?'current-password':'new-password';error.textContent='';}document.querySelector('#login-tab').onclick=()=>setMode('login');document.querySelector('#register-tab').onclick=()=>setMode('register');form.addEventListener('submit',async event=>{event.preventDefault();error.textContent='';const payload={username:usernameInput.value.trim(),password:passwordInput.value};if(mode==='register')payload.password_confirmation=confirmationInput.value;let response;try{response=await fetch(`/api/v1/auth/${mode}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});}catch(_){error.textContent='无法连接本地服务。';return}if(!response.ok){let body={};try{body=await response.json()}catch(_){}error.textContent=body.message||'账户请求失败，请核对输入。';return}location.replace('/');});
</script></body></html>
