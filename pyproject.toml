[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-investment-copilot"
version = "0.1.0"
description = "Evidence-grounded personalized investment decision-support copilot."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "pillow>=10.0.0",
  "rapidocr-onnxruntime>=1.3.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
postgres = [
  "psycopg[binary]>=3.2,<4",
]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.2,<9",
]
web = [
  "uvicorn>=0.30,<1",
]

[tool.setuptools.packages.find]
include = ["app*", "tools*"]

[tool.setuptools.data-files]
"eval_cases" = ["eval_cases/*.json"]

[tool.setuptools.package-data]
app = [
  "store/migrations/*.sql",
  "api/static/*.html",
  "api/static/*.css",
  "api/static/*.js",
  "api/static/*.png",
  "api/static/*.txt",
  "fixtures/advisor/*.json",
  "fixtures/advisor/providers/*.json",
  "fixtures/research/*.json",
  "fixtures/research/providers/*.json",
  "fixtures/stock/*.json",
  "fixtures/stock/providers/*.json",
  "fixtures/fund/*.json",
  "fixtures/fund/providers/*.json",
  "fixtures/convertible_bond/*.json",
  "fixtures/convertible_bond/providers/*.json",
  "fixtures/optimization/*.json",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
